# SIRUSSOFTS_PRIVATE_GUARD
# Install in BOTH Hestia nginx.conf_siruscms (HTTP) and nginx.ssl.conf_siruscms
# (HTTPS). These server-level prefixes outrank nested static-extension regexes
# in Hestia's default proxy template; do NOT reduce them to a single regex.
# Hestia owns the surrounding server blocks, TLS, PHP and reverse proxy.
location = /app { return 404; }
location ^~ /app/ { return 404; }
location = /bin { return 404; }
location ^~ /bin/ { return 404; }
location = /tests { return 404; }
location ^~ /tests/ { return 404; }
location = /data { return 404; }
location ^~ /data/ { return 404; }
location = /private { return 404; }
location ^~ /private/ { return 404; }
location = /internal { return 404; }
location ^~ /internal/ { return 404; }
location = /deploy { return 404; }
location ^~ /deploy/ { return 404; }
location ~* \.(?:sqlite3?|db|bak|env|pem|key|log|md)$ { return 404; }
location = /.htaccess { return 404; }
location = /.user.ini { return 404; }
