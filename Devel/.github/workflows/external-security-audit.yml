name: SirusSofts external security audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/webhook-deployer-v0.1
    paths:
      - .github/workflows/external-security-audit.yml
      - security/external_audit.py

permissions:
  contents: read

concurrency:
  group: sirussofts-external-audit
  cancel-in-progress: false

jobs:
  external-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run bounded owner-authorized external checks
        run: python3 security/external_audit.py
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirussofts-external-audit
          path: security-results/
          retention-days: 14
          if-no-files-found: warn
