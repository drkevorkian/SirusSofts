# SIRUSSOFTS_PRIVATE_GUARD
# Load ONLY as Hestia's per-site nginx.conf_* server-level include.
# Hestia owns the surrounding server blocks, TLS, PHP and reverse proxy.
# Nginx must never serve the CMS internal application sources.
location ~* ^/(?:app|bin|tests|data|private|internal|deploy)(?:/|$) {
    return 404;
}
location ~* \.(?:sqlite3?|db|bak|env|pem|key|log|md)$ {
    return 404;
}
location = /.htaccess { return 404; }
location = /.user.ini { return 404; }
