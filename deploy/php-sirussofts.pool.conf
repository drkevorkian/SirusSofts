; SirusSofts isolated pool. PHP never runs as root.
[sirussofts]
user = sirusweb
group = sirusweb
listen = /run/php/sirussofts.sock
listen.owner = sirusweb
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300
clear_env = yes
env[SIRUS_CMS_PRIVATE_ROOT] = /var/lib/sirussofts/cms
php_admin_value[open_basedir] = /srv/sirussofts:/var/lib/sirussofts:/var/lib/php/sessions:/etc/sirussofts/node-keys:/tmp:/usr/share/php
php_admin_value[expose_php] = Off
