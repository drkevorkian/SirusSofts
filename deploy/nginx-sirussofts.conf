# SirusSofts managed nginx HTTP vhost. Obtain valid certificates separately.
server {
    listen 80;
    listen [::]:80;
    server_name sirussofts.org www.sirussofts.org sirussofts.com www.sirussofts.com;
    root /srv/sirussofts/current/CMS;
    index index.php;
    autoindex off;
    client_max_body_size 1m;
    # Managed, allowlisted app prefix routes. Glob is empty until explicitly provisioned.
    include /etc/nginx/sirussofts-managed/routes/*.conf;

    location ~ ^/(?:app|bin|tests|data|private|internal|deploy)(?:/|$) { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(?:sqlite3?|db|bak|env|key)$ { return 404; }

    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ ^/(?:index|api|node-heartbeat)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/sirussofts.sock;
    }
    location ~ \.php$ { return 404; }
}
