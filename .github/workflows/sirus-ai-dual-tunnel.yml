name: SirusSofts AI dual-tunnel validation

on:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and unit integration tests
        run: |
          cd sirus-ai-dual-tunnel
          python3 -m compileall -q gentoo ubuntu tests
          python3 -m unittest discover -s tests -v
          cd ..
          python3 -m py_compile gentoo-node/pdf_duplicate_audit.py
          python3 -m unittest discover -s gentoo-node/tests -p 'test_pdf_duplicate_audit.py' -v
      - name: Shell syntax
        run: |
          bash -n sirus-ai-dual-tunnel/gentoo/install.sh
          bash -n sirus-ai-dual-tunnel/gentoo/upgrade-in-place.sh
          bash -n sirus-ai-dual-tunnel/ubuntu/upgrade-in-place.sh
          bash -n sirus-ai-dual-tunnel/gentoo/gpu-workers.sh
          bash -n sirus-ai-dual-tunnel/ubuntu/install.sh
          bash -n sirus-ai-dual-tunnel/ubuntu/repair-input-port-18485.sh
      - name: Browser JavaScript and offline MathML rendering
        run: |
          node --check sirus-ai-dual-tunnel/ubuntu/web/app.js
          node --check sirus-ai-dual-tunnel/ubuntu/web/render_math.js
          node sirus-ai-dual-tunnel/tests/test_math_render.js
