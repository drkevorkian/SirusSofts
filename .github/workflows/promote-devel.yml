name: Publish tested Devel to main
on:
  workflow_dispatch:

# This action is deliberately operator-triggered. A passing test of an
# unfinished experimental commit must not publish it without a release decision.
permissions:
  contents: write
  actions: read
concurrency:
  group: sirussofts-publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout production main (not the development branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read current production and development heads
        run: git fetch --no-tags origin main devel
      - name: Require the latest Devel commit to have passed its full CI suite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          sha=subprocess.check_output(
              ["git","rev-parse","origin/devel"], text=True
          ).strip()
          repository=os.environ["GH_REPO"]
          url=(f"https://api.github.com/repos/{repository}/actions/"
               f"workflows/php-framework.yml/runs?branch=devel&"
               f"head_sha={sha}&per_page=100")
          request=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"
          })
          with urllib.request.urlopen(request,timeout=20) as response:
              data=json.load(response)
          verified=[
              r for r in data.get("workflow_runs",[])
              if r.get("head_sha")==sha and r.get("head_branch")=="devel"
              and r.get("conclusion")=="success"
              and r.get("name")=="Devel - complete mirrored SirusSofts test suite"
          ]
          if not verified:
              raise SystemExit("FAIL: latest Devel/ commit has no passing complete CI run. Main unchanged.")
          print("PASS Devel/ full suite verified at",sha[:12])
          PY
      - name: Check for overlapping production changes without touching files
        run: python3 -B scripts/promote_devel.py --dry-run
      - name: Move only the tested Devel/ delta to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -B scripts/promote_devel.py --publish
      - name: Verify production branch SHA after publishing
        run: |
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$local_sha" = "$remote_sha"
          echo "PASS main now points to $remote_sha"
