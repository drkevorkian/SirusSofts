name: PHP framework checks
on:
  pull_request:
    paths:
      - 'CMS/**'
      - 'node/**'
      - 'deploy/**'
      - '.github/workflows/php-framework.yml'
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: PHP prerequisites
        run: |
          php -v
          php -m | grep -qi pdo_sqlite
          php -m | grep -qi sodium
      - name: PHP syntax
        run: find CMS -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Registry and CMS tests
        run: |
          php -d zend.assertions=1 -d assert.exception=1 CMS/tests/storage_registry_test.php
          php CMS/tests/smoke.php
      - name: Storage, backup, and migration tests
        run: |
          php CMS/tests/storage_adapter_test.php
          php CMS/tests/backup_test.php
          php CMS/tests/storage_migration_test.php
          php CMS/tests/node_registry_test.php
          php CMS/tests/storage_cli_test.php
          php CMS/tests/operations_admin_test.php
          php CMS/tests/github_projects_test.php
          php CMS/tests/hosting_config_test.php
          php CMS/tests/storage_github_test.php
      - name: Gentoo agent unit tests
        run: python3 -m unittest discover -s node/tests -p 'test_*.py' -v
      - name: OpenRC installer syntax
        run: bash -n node/install-openrc.sh
      - name: JavaScript syntax
        run: node --check CMS/assets/cms.js
      - name: Ubuntu installer syntax and read-only preflight
        run: |
          bash -n deploy/install-framework-ubuntu.sh
          bash deploy/install-framework-ubuntu.sh --check
      - name: Restricted Nginx vhost agent tests
        run: python3 -m unittest discover -s deploy/tests -p 'test_nginx_vhost_agent.py' -v
      - name: Nginx vhost installer read-only preflight
        run: |
          bash -n deploy/install-nginx-vhost-agent.sh
          bash deploy/install-nginx-vhost-agent.sh --check
      - name: Parse generated app and CMS configs with real Nginx
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nginx
          fi
          python3 -m unittest discover -s deploy/tests -p 'test_nginx_config.py' -v
