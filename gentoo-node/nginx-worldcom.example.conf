# Gentoo Nginx example: a loopback-only virtual-host gateway for CPU-heavy apps.
# After reviewing this file against Gentoo's active nginx conf, install it there.
# No public Gentoo listener. Ubuntu terminates HTTPS and forwards a Host header
# through the outbound SSH tunnel 18481 -> 127.0.0.1:18081.
#
# A separate WorldCom Native service is expected to listen on 127.0.0.1:19000.
# This example does not install WorldCom or assume its actual framework/port.
server {
    listen 127.0.0.1:18081 default_server;
    server_name _;
    return 444;
}
server {
    listen 127.0.0.1:18081;
    server_name worldcom.sirussofts.com;

    access_log /var/log/nginx/sirus-worldcom-access.log;
    error_log /var/log/nginx/sirus-worldcom-error.log;

    location / {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
